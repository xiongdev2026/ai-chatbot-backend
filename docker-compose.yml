# Postgres + pgvector for the backend (RAG embeddings live here).
# Connection string is set in back/.env → DATABASE_URL (localhost:5434).
#
# `name:` pins the compose project name so the data volume is always
# `ai-chatbot_pgvector_data` regardless of which folder you run this from —
# this keeps existing DB data attached after moving the file here.
version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai_chatbot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: db_ai_chatbot
    ports:
      - "5434:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
